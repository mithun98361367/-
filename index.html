<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Ticket System - Home</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- Reusable Header -->
    <div id="header"></div>


    <main class="container">

        <h1 class="page-title">
            Dashboard
        </h1>

        <p class="page-subtitle">
            Welcome to the Ticket Management System
        </p>


        <div class="grid">

            <div class="card stat-card">

                <div class="stat-icon">
                    🎫
                </div>

                <div>
                    <div class="stat-number">
                        24
                    </div>

                    <div class="stat-label">
                        Total Tickets
                    </div>
                </div>

            </div>


            <div class="card stat-card">

                <div class="stat-icon">
                    👨‍🔧
                </div>

                <div>
                    <div class="stat-number">
                        12
                    </div>

                    <div class="stat-label">
                        Engineers
                    </div>
                </div>

            </div>


            <div class="card stat-card">

                <div class="stat-icon">
                    📍
                </div>

                <div>
                    <div class="stat-number">
                        8
                    </div>

                    <div class="stat-label">
                        Engineers Online
                    </div>
                </div>

            </div>

        </div>

    </main>


    <footer class="footer">
        © 2026 Ticket System
    </footer>


    <!-- Reusable Header Component -->
    <script src="header.js"></script>

</body>

</html>
