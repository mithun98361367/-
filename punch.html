<h1 class="page-title">
    Punch In / Out
</h1>

<p class="page-subtitle">
    Record attendance with device location
</p>


<div class="card">

    <h2>
        Engineer Attendance
    </h2>


    <div class="form-group">

        <label>
            Engineer ID
        </label>

        <input
            type="text"
            placeholder="ENG-001">

    </div>


    <div
        id="locationStatus"
        class="location-box">

        📍 Location not checked

    </div>


    <button
        class="btn btn-green btn-full"
        onclick="getLocation('Punch In')">

        🟢 Punch In

    </button>


    <button
        class="btn btn-red btn-full"
        style="margin-top:10px;"
        onclick="getLocation('Punch Out')">

        🔴 Punch Out

    </button>
